version: 1

models:
  default:
    provider: openai-compatible
    name: gpt-5.6-luna
    api_key_env: AI_API_KEY
    base_url: https://api.utksh.in/v1
    temperature: 0.0
    max_tokens: 8192
    request_timeout_seconds: 240
    max_retries: 6
    extra:
      backoff_base_seconds: 3.0

agents:
  - agent_id: architect-1
    role: architect
    model: default
  - agent_id: mgr-1
    role: manager
    model: default
  - agent_id: locator-1
    role: locator
    model: default
  - agent_id: impl-1
    role: implementer
    model: default
  - agent_id: ver-1
    role: verifier
    model: default

tools:
  command_timeout_seconds: 60
  allow_network_commands: false

budget:
  # Real-feature runs on sonnet-class models need ~2M tokens (plan +
  # specialists + recovery retries + final review); 4M keeps the governor
  # a genuine runaway rail instead of a mid-run cliff.
  total_tokens: 4000000

storage:
  backend: sqlite
  sqlite_path: .harness/live.db

logging:
  level: INFO
  json_format: true
  file_path: .harness/harness.log

run:
  wall_clock_seconds: 1800
  max_steps: 60
  results_dir: results
