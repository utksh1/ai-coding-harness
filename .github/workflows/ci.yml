name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,platform]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Type check
        run: mypy
      - name: Test
        run: pytest

  launcher:
    # bin/foreman is the product's front door — CI must at least prove it
    # parses (bash -n) and keeps its exec bit (regression: mode 100644 was
    # pushed once and CI caught it only by luck of a later step).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax + mode gate
        run: |
          bash -n bin/foreman
          test -x bin/foreman
          bash -n scripts/*.sh 2>/dev/null || true

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: gateway/go.sum
      - name: Build + vet + test
        run: |
          cd gateway
          go build ./...
          go vet ./...
          go test ./...
